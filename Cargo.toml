[package]
name = "omo-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
autobins = false
description = "Ultra-fast, zero-GC async AI agent gateway and session multiplexer for Discord in 100% Rust"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Indosaram/omo-gateway"
keywords = ["discord", "agent", "multiplexer", "llm", "hermes"]
categories = ["network-programming", "asynchronous"]

[lib]
name = "omon_gateway"
path = "src/lib.rs"

[[bin]]
name = "omo-gateway"
path = "src/entry.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.43", features = ["full", "test-util"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["json", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
poise = "0.6"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }
dashmap = "6.1"
dotenvy = "0.15"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
libc = "0.2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
fs2 = "0.4"
songbird = { version = "0.5", default-features = false, features = ["driver", "gateway", "serenity", "rustls", "receive", "tungstenite"] }
cron = "0.15"
urlencoding = "2.1"
base64 = "0.22"
sha2 = "0.10"
regex = "1.11"
tokio-tungstenite = "0.26"
resvg = "0.48.1"
usvg = "0.48.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "test_voice_transcription"
path = "tests/test_voice_transcription.rs"

[[test]]
name = "test_model_routing"
path = "tests/test_model_routing.rs"

[[test]]
name = "test_lanes_storage"
path = "tests/test_lanes_storage.rs"

[[test]]
name = "test_lane_runner"
path = "tests/test_lane_runner.rs"

[[test]]
name = "test_lane_cli"
path = "tests/test_lane_cli.rs"

[[test]]
name = "test_lane_reopen"
path = "tests/test_lane_reopen.rs"

[[test]]
name = "test_profile_import"
path = "tests/test_profile_import.rs"

[[test]]
name = "test_inbox_store"
path = "tests/test_inbox_store.rs"

[[test]]
name = "test_inbox_sources"
path = "tests/test_inbox_sources.rs"

[[test]]
name = "test_session_registry"
path = "tests/test_session_registry.rs"

[[test]]
name = "test_lane_events"
path = "tests/test_lane_events.rs"

[[test]]
name = "test_lane_scrub"
path = "tests/test_lane_scrub.rs"

[[test]]
name = "test_lane_dispatch"
path = "tests/test_lane_dispatch.rs"

[[test]]
name = "test_cron_health"
path = "tests/test_cron_health.rs"

[[test]]
name = "test_lane_done"
path = "tests/test_lane_done.rs"

